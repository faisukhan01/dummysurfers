name: Build Unity Android APK (Dummy Surfer 3D)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  UNITY_IMAGE: unityci/editor:ubuntu-6000.0.32f1-android-3
  KS_PASS: 'DummySurfersDebug!2024'
  KS_ALIAS: dummysurfers

jobs:
  # ------------------------------------------------------------------
  # Gate: only run the (heavy) Unity build when a license is available.
  # Supported: UNITY_LICENSE (.ulf), UNITY_SERIAL (Pro), or
  # UNITY_EMAIL + UNITY_PASSWORD (Personal auto-activation inside CI).
  # See docs/CI_UNITY_LICENSE_SETUP.md
  # ------------------------------------------------------------------
  license-gate:
    name: License check
    runs-on: ubuntu-latest
    outputs:
      licensed: ${{ steps.gate.outputs.licensed }}
    steps:
      - id: gate
        env:
          HAS_ULF: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_EMAIL_PW: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
        run: |
          if [ "$HAS_ULF" = "true" ] || [ "$HAS_SERIAL" = "true" ] || [ "$HAS_EMAIL_PW" = "true" ]; then
            echo "licensed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "licensed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Unity 6 → Android APK
    needs: license-gate
    if: needs.license-gate.outputs.licensed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (Unity images are large)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc 2>/dev/null || true
          df -h /

      # A throw-away signing keystore so the APK installs out of the box.
      - name: Generate CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/dummysurfers.keystore" \
            -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Dummy Surfer, OU=Games, O=DummySurfers, L=Web, S=Web, C=PK"

      # --------------------------------------------------------------
      # ONE persistent container for login + prep + build, so the
      # license acquired at login stays valid for the whole pipeline.
      # --------------------------------------------------------------
      - name: Start Unity container
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run -d --name unity-build \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            -e CI_KEYSTORE_PATH=/project/dummysurfers.keystore \
            -e "CI_KEYSTORE_PASS=$KS_PASS" \
            -e "CI_KEYALIAS_NAME=$KS_ALIAS" \
            -e "CI_KEYALIAS_PASS=$KS_PASS" \
            -e "CI_VERSION_NAME=1.0.${{ github.run_number }}" \
            -e "CI_VERSION_CODE=${{ github.run_number }}" \
            "$UNITY_IMAGE" \
            bash -c 'sleep infinity'
          docker ps --filter name=unity-build

      # --------------------------------------------------------------
      # Personal license claim — Unity.Licensing.Client's documented
      # headless path:  --activate-all --include-personal  with
      # username/password (Personal fallback when no paid seats exist).
      # A services-config.json is written first because the CI image
      # lacks a valid licensingServiceBaseUrl.
      # --------------------------------------------------------------
      - name: Acquire Unity Personal license (activate-all + include-personal)
        timeout-minutes: 15
        run: |
          docker exec unity-build bash -c '
            set +e
            CLIENT=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
            echo "=== [0] services config (before) ==="
            cat /usr/share/unity3d/config/services-config.json 2>/dev/null || echo "(none)"
            mkdir -p /usr/share/unity3d/config
            printf "%s\n" "{\"licensingServiceBaseUrl\":\"https://api.unity.com/v1/licensing\",\"enableEntitlementLicensing\":true}" > /usr/share/unity3d/config/services-config.json
            echo "=== [0] services config (now) ==="
            cat /usr/share/unity3d/config/services-config.json
            echo "=== [1] show assigned seats ==="
            timeout 60 "$CLIENT" --show-seats --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | tail -20 || true
            echo "=== [2] ACTIVATE personal (activate-all + include-personal) ==="
            timeout 240 "$CLIENT" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | tail -30 || true
            echo "=== [3] show local entitlements ==="
            timeout 60 "$CLIENT" --showEntitlements 2>&1 | tail -20 || true
            echo "=== [4] editor license check ==="
            timeout 180 unity-editor -batchmode -nographics -quit -logFile /dev/stdout 2>&1 | tail -6 || true
            echo "=== [5] fallback: update-license + re-check ==="
            timeout 240 "$CLIENT" --update-license --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | tail -20 || true
            timeout 180 unity-editor -batchmode -nographics -quit -logFile /dev/stdout 2>&1 | tail -6 || true
            echo "license step done"
            exit 0
          '

      # --------------------------------------------------------------
      # Headless project preparation — same as the in-editor wizard:
      # URP, quality tiers, Android settings, data assets, runner
      # prefab, scenes (Boot / MainMenu / Game), build settings.
      # Fails loudly here if the license was not acquired above.
      # --------------------------------------------------------------
      - name: Generate scenes & assets (headless Unity)
        timeout-minutes: 20
        run: |
          docker exec unity-build bash -c '
            set -o pipefail
            xvfb-run -a unity-editor -batchmode -quit \
              -projectPath /project \
              -executeMethod DummySurfer.EditorTools.CiEntryPoint.PrepareCiBuild \
              -logFile /dev/stdout
          '

      # --------------------------------------------------------------
      # The real Android APK build (IL2CPP · ARM64 · signed).
      # --------------------------------------------------------------
      - name: Build Android APK
        timeout-minutes: 60
        run: |
          docker exec unity-build bash -c '
            set -o pipefail
            xvfb-run -a unity-editor -batchmode -quit \
              -projectPath /project \
              -executeMethod DummySurfer.EditorTools.CiEntryPoint.BuildAndroid \
              -logFile /dev/stdout
          '

      - name: Show build output
        if: always()
        run: |
          ls -la "$GITHUB_WORKSPACE/build/Android" 2>/dev/null || echo "no build/Android dir"

      - name: Stop Unity container
        if: always()
        run: docker rm -f unity-build || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DummySurfers-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unity-v1.0.${{ github.run_number }}
          name: Dummy Surfer 3D — Android build v1.0.${{ github.run_number }}
          body: |
            ## 🎮 Dummy Surfer — Unity 6 · URP · 3D Endless Runner (Android CI build)

            Built automatically from commit `${{ github.sha }}` on `main`.

            **Install:** download the `.apk` below → allow *"Install unknown apps"* → install.

            * APK is signed with a CI debug keystore (fine for testing).
            * Spec: Extreme Visual Fidelity Master Prompt (Unity 6 · C# · URP · Netcode).
          files: build/Android/*.apk

  # ------------------------------------------------------------------
  # Friendly guidance when no license secret is configured yet — the
  # run stays green and tells you exactly what to do next.
  # ------------------------------------------------------------------
  how-to-enable:
    name: Unity license needed
    needs: license-gate
    if: needs.license-gate.outputs.licensed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print activation guide
        run: |
          {
            echo "## 🔒 One step left before I can build your APK"
            echo ""
            echo "Unity builds **require a Unity license**, and Unity only lets the"
            echo "account owner activate it — GitHub (or me) cannot do that for you."
            echo ""
            echo "### Easiest way — no Unity install needed (about 5 minutes):"
            echo ""
            echo "1. Actions tab → run **Unity Activation File (one-time license setup)**"
            echo "   → download its **Unity_Activation_File** artifact → unzip it:"
            echo "   you get a small .alf file."
            echo "2. Open **https://license.unity3d.com/manual** in your browser and sign in"
            echo "   with your Unity ID (create one free at https://id.unity.com if needed)."
            echo "3. Upload the .alf file → choose **Unity Personal Edition** (free) →"
            echo "   answer the 2 short questions → download **Unity_v1.x.ulf**."
            echo "4. Repo → **Settings → Secrets and variables → Actions → New repository secret**"
            echo "   - Name: UNITY_LICENSE · Value: the **full contents** of the .ulf file"
            echo "5. Re-run this workflow (**Actions → Build Unity Android APK → Run workflow**)."
            echo ""
            echo "The APK will then be attached to a new Release automatically. 🚀"
            echo ""
            echo "Full guide: \`docs/CI_UNITY_LICENSE_SETUP.md\` in the repo (Option A)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "License secret missing — see the run summary + docs/CI_UNITY_LICENSE_SETUP.md"
