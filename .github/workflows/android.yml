name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/DummySurfers-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DummySurfers-APK
          path: output/DummySurfers-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dummy Surfers v1.0.${{ github.run_number }}
          body: |
            ## 🛹 Dummy Surfers — CI Build v1.0.${{ github.run_number }}

            ✅ Automatic build from commit `${{ github.sha }}` on `main`.

            ### 📲 Install
            1. Download **DummySurfers-debug.apk** below
            2. Allow *"Install unknown apps"* for your browser when prompted
            3. Install & play!

            ### 🎮 How to play
            - Swipe ⬅️ ➡️ to change lanes
            - Swipe ⬆️ to jump barriers
            - Swipe ⬇️ to slide under bars
            - Collect coins, dodge trains & beat your best score!
          files: output/DummySurfers-debug.apk
