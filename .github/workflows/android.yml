name: Build Dummy Surfers

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Build Release AAB (Play Store bundle)
        run: ./gradlew :android:bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/build/outputs/apk/release/app-release.apk out/DummySurfers.apk
          cp android/build/outputs/apk/debug/app-debug.apk  out/DummySurfers-debug.apk
          cp android/build/outputs/bundle/release/*.aab     out/DummySurfers-release.aab
          ls -la out

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-build
          path: out/*

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' android/build.gradle.kts | head -1)
          TAG="v${VER}"
          echo "Publishing release ${TAG} (Dummy Surfers ${VER})"
          rm -f notes.md
          cat > notes.md <<EOF
          ## Dummy Surfers ${VER}

          Download & play:

          - **DummySurfers.apk** — signed release build. Install directly on any Android 7.0+ phone (allow "install unknown apps").

          Scan the QR code on the project landing page, or open:
          \`https://github.com/${REPO}/releases/latest/download/DummySurfers.apk\`

          ### What's inside
          - Full 35-section spec: pseudo-3D endless runner, SS-style trains, iron-rule spawner
          - 5 power-ups x 3 upgrade levels, 4 characters, 4 trails, missions, shop
          - 100% procedural art + PCM-synth audio (zero asset files)
          - Kotlin 2.0 / LibGDX 1.12.1 / Android API 24+

          Older builds: see the [releases page](https://github.com/${REPO}/releases).
          EOF
          gh release delete "${TAG}" --repo "${REPO}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "Dummy Surfers ${VER}" \
            --notes-file notes.md \
            out/DummySurfers.apk out/DummySurfers-debug.apk out/DummySurfers-release.aab
          echo "Release published: https://github.com/${REPO}/releases/tag/${TAG}"
