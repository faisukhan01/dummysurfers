name: Build Dummy Surfers

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Build Release AAB (Play Store bundle)
        run: ./gradlew :android:bundleRelease --stacktrace

      - name: Build Release APK
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-debug-apk
          path: android/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-release-apk
          path: android/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-release-aab
          path: android/build/outputs/bundle/release/*.aab
