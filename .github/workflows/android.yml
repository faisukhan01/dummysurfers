name: Build Dummy Surfers

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Build Release AAB (Play Store bundle)
        run: ./gradlew :android:bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          VER=$(grep -oP 'versionName = "\K[^"]+' android/build.gradle.kts | head -1)
          echo "Build outputs found:"
          find android/build/outputs -name "*.apk" -o -name "*.aab" | sort
          cp android/build/outputs/apk/release/*.apk out/DummySurfers.apk
          cp android/build/outputs/apk/release/*.apk out/DummySurfers-v${VER}.apk
          cp android/build/outputs/apk/debug/*.apk  out/DummySurfers-debug.apk
          cp android/build/outputs/bundle/release/*.aab out/DummySurfers-release.aab
          ls -la out

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-build
          path: out/*

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' android/build.gradle.kts | head -1)
          TAG="v${VER}"
          echo "Publishing release ${TAG} (Dummy Surfers ${VER})"
          rm -f notes.md
          cat > notes.md <<EOF
          ## Dummy Surfers ${VER} — the Subway-Surfers-fidelity update 🚇

          **IMPORTANT — this is version ${VER} (versionCode 10).** After installing, check
          Android Settings → Apps → Dummy Surfers → version "${VER}". Older 1.2/1.3 downloads
          were stale cached files — this one is brand new.

          ### What changed (renderer v2)
          - 🎨 **Textured 3D world**: livery trains with windows/wheels/graffiti, hazard
            barriers, container blockades, building facades with lit windows, glass towers
          - 🛤️ **Camera fixed**: the world was rendered vertically inverted since v1.0 —
            perspective now converges correctly toward the horizon
          - 🏃 **THE RUNNER IS ACTUALLY VISIBLE NOW** — a never-executed lambda hid the
            player since v1.0 (yes, really)
          - 💥 Fixed a latent crash on coin pickups (spark particles)
          - 🚄 Bigger chibi runner + security guard chase, ground extends under the camera

          ### Downloads
          - **DummySurfers.apk** — signed release build (always this version)
          - **DummySurfers-v${VER}.apk** — same file, version-stamped name
          - Install on any Android 7.0+ phone (allow "install unknown apps")

          Scan the QR code on the project landing page, or open:
          \`https://github.com/${REPO}/releases/latest/download/DummySurfers.apk\`

          100% original procedural art + PCM-synth audio. Kotlin 2.0 / LibGDX 1.12.1.
          Older builds: see the [releases page](https://github.com/${REPO}/releases).
          EOF
          gh release delete "${TAG}" --repo "${REPO}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "Dummy Surfers ${VER}" \
            --notes-file notes.md \
            out/DummySurfers.apk out/DummySurfers-v${VER}.apk out/DummySurfers-debug.apk out/DummySurfers-release.aab
          echo "Release published: https://github.com/${REPO}/releases/tag/${TAG}"
