name: Build Dummy Surfers # re-register CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Build Release AAB (Play Store bundle)
        run: ./gradlew :android:bundleRelease --stacktrace

      - name: Build Release APK
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-debug-apk
          path: android/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-release-apk
          path: android/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dummy-surfers-release-aab
          path: android/build/outputs/bundle/release/*.aab

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version name
        id: ver
        run: |
          V=$(grep -o 'versionName = "[^"]*"' android/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Building release for v$V"

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dummy-surfers-release-apk

      - name: Rename to stable asset name
        run: cp *.apk DummySurfers.apk

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Dummy Surfers v${{ steps.ver.outputs.version }}
          body: |
            Dummy Surfers by Faisal Khan — v${{ steps.ver.outputs.version }} (versionCode auto)
            True-3D endless runner. Install: download DummySurfers.apk and allow unknown sources.
          files: DummySurfers.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
